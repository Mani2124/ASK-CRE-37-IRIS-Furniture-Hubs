services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DB_URI: postgresql://iris:${POSTGRES_PASSWORD:-local_demo_only_change_me}@db:5432/iris
    depends_on:
      db:
        condition: service_healthy
volumes:
  iris_pgdata:
